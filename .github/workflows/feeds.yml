name: Actualizar feeds de fabricantes

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, minuto 17 (UTC)
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write            # solo para guardar data/feeds.json en el repositorio

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11 requests==2.32.3
      - run: python fetch_feeds.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feeds.json
            git commit -m "Actualizar feeds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Sin cambios"
          fi
